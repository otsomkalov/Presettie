trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src

variables:
  Runtime: 'linux-x64'
  Configuration: 'Release'

pool: 'self-hosted'

stages:
  - stage: build
    displayName: 'Build'
    jobs:
      - job: build_all
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET'
            inputs:
              useGlobalJson: true
          - task: DotNetCoreCLI@2
            displayName: 'Install Fantomas formatter'
            inputs:
              command: 'custom'
              custom: 'tool'
              arguments: 'install -g fantomas'
          - task: Bash@3
            displayName: 'Run Fantomas'
            inputs:
              targetType: 'inline'
              script: |
                fantomas . --check
              workingDirectory: '$(Build.SourcesDirectory)'
          - task: DotNetCoreCLI@2
            name: Test
            inputs:
              command: 'test'
              projects: 'tests/**/*.fsproj'
              arguments: '-r $(Runtime) -c $(Configuration) --coverage --coverage-output-format cobertura'
          - task: PublishCodeCoverageResults@2
            displayName: 'Publish coverage'
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/*.cobertura.xml'
          - task: DotNetCoreCLI@2
            displayName: 'Publish Telegram Bot'
            inputs:
              command: 'publish'
              projects: 'src/**/Functions.Bot.Telegram.fsproj'
              arguments: '-r $(Runtime) -o $(Build.ArtifactStagingDirectory)/Functions.Bot.Telegram /p:InformationalVersion=$(Build.BuildNumber)'
              publishWebProjects: false
          - task: DotNetCoreCLI@2
            displayName: 'Publish Azure Functions Web API'
            inputs:
              command: 'publish'
              projects: 'src/**/Functions.API.fsproj'
              arguments: '-r $(Runtime) -o $(Build.ArtifactStagingDirectory)/Functions.API /p:InformationalVersion=$(Build.BuildNumber)'
              publishWebProjects: false
          - task: DotNetCoreCLI@2
            displayName: 'Publish Bolero Web'
            inputs:
              command: 'publish'
              projects: 'src/**/Bolero.Web.fsproj'
              arguments: '-o $(Build.ArtifactStagingDirectory)/Bolero.Web /p:InformationalVersion=$(Build.BuildNumber) /p:WasmApplicationEnvironmentName=Production'
              publishWebProjects: false
          - task: DotNetCoreCLI@2
            displayName: 'Publish Azure Functions Generator'
            inputs:
              command: 'publish'
              projects: 'src/**/Functions.Generator.fsproj'
              arguments: '-r $(Runtime) -o $(Build.ArtifactStagingDirectory)/Functions.Generator /p:InformationalVersion=$(Build.BuildNumber)'
              publishWebProjects: false
          - task: PublishBuildArtifacts@1
            displayName: 'Pack Telegram Bot'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/Functions.Bot.Telegram'
              ArtifactName: 'Functions.Bot.Telegram'
          - task: PublishBuildArtifacts@1
            displayName: 'Pack Azure Functions Web API'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/Functions.API'
              ArtifactName: 'Functions.API'
          - task: PublishBuildArtifacts@1
            displayName: 'Pack Bolero Web'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/Bolero.Web'
              ArtifactName: 'Bolero.Web'
          - task: PublishBuildArtifacts@1
            displayName: 'Pack Azure Functions Generator'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/Functions.Generator'
              ArtifactName: 'Functions.Generator'
  - stage: deploy_dev
    displayName: 'Deploy DEV'
    dependsOn: build
    condition: succeeded('build')
    variables:
      - group: dev
    jobs:
      - deployment: deploy_bot
        displayName: 'Deploy Telegram Bot on Azure Functions'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Functions.Bot.Telegram
                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: 'az-dev'
                    appType: 'functionAppLinux'
                    appName: '$(bot-functions-name)'
                    package: '$(Pipeline.Workspace)/Functions.Bot.Telegram/*.zip'
                    isFlexConsumption: true
      - deployment: deploy_api
        displayName: 'Deploy Azure Functions Web API'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Functions.API

                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: 'az-dev'
                    appType: 'functionAppLinux'
                    appName: '$(api-functions-name)'
                    package: '$(Pipeline.Workspace)/Functions.API/*.zip'
                    isFlexConsumption: true
      - deployment: deploy_generator
        displayName: 'Deploy Azure Functions Generator'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Functions.Generator

                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: 'az-dev'
                    appType: 'functionAppLinux'
                    appName: '$(generator-functions-name)'
                    package: '$(Pipeline.Workspace)/Functions.Generator/*.zip'
                    isFlexConsumption: true
      - deployment: deploy_bolero
        displayName: 'Deploy Bolero Web'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Bolero.Web
                - task: ExtractFiles@1
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/Bolero.Web/Bolero.Web.zip'
                    destinationFolder: '$(Pipeline.Workspace)/Bolero.Web/dist'
                    cleanDestinationFolder: true
                    overwriteExistingFiles: true
                - task: AzureCLI@2
                  displayName: 'Copy Bolero Web to Blob Storage'
                  inputs:
                    azureSubscription: 'az-dev'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob upload-batch \
                        --auth-mode login \
                        --account-name $(web-storage-account) \
                        -d '$web' \
                        -s $(Pipeline.Workspace)/Bolero.Web/dist/wwwroot \
                        --overwrite \
                        --no-progress
  - stage: deploy_prd
    displayName: 'Deploy PRD'
    dependsOn: deploy_dev
    condition: succeeded('deploy_dev')
    variables:
      - group: prd
    jobs:
      - deployment: deploy_bot
        displayName: 'Deploy Telegram Bot on Azure Functions'
        environment: 'prd'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Functions.Bot.Telegram

                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: 'az-prd'
                    appType: 'functionAppLinux'
                    appName: '$(bot-functions-name)'
                    package: '$(Pipeline.Workspace)/Functions.Bot.Telegram/*.zip'
      - deployment: deploy_api
        displayName: 'Deploy Azure Functions Web API'
        environment: 'prd'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Functions.API

                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: 'az-prd'
                    appType: 'functionAppLinux'
                    appName: '$(api-functions-name)'
                    package: '$(Pipeline.Workspace)/Functions.API/*.zip'
      - deployment: deploy_bolero
        displayName: 'Deploy Bolero Web'
        environment: 'prd'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Bolero.Web
                - task: ExtractFiles@1
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/Bolero.Web/Bolero.Web.zip'
                    destinationFolder: '$(Pipeline.Workspace)/Bolero.Web/dist'
                    cleanDestinationFolder: true
                    overwriteExistingFiles: true
                - task: AzureCLI@2
                  displayName: 'Copy Bolero Web to Blob Storage'
                  inputs:
                    azureSubscription: 'az-prd'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob upload-batch \
                        --auth-mode login \
                        --account-name $(web-storage-account) \
                        -d '$web' \
                        -s $(Pipeline.Workspace)/Bolero.Web/dist/wwwroot \
                        --overwrite \
                        --no-progress
      - deployment: deploy_generator
        displayName: 'Deploy Azure Functions Generator'
        environment: 'prd'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: Functions.Generator

                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: 'az-prd'
                    appType: 'functionAppLinux'
                    appName: '$(generator-functions-name)'
                    package: '$(Pipeline.Workspace)/Functions.Generator/*.zip'
                    isFlexConsumption: true